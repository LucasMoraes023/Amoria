:'👶',n:'Nascimento',h:'Boas-vindas para',fin:'Que sua vida seja repleta de amor.'},pascoa:{e:'🐣',n:'Páscoa',h:'Uma feliz Páscoa para',fin:'Que seu dia seja doce e cheio de carinho.'}};

const blank=()=>({id:'',type:'declaracao',from:'',to:'',title:'',line:'',msg:'',sign:'',fin:'',photos:[],date:'',dl:'Juntos há',counter:true,tl:[],theme:'classic',fx:'hearts',priv:'public',pass:'',at:'',music:null,gal:'carousel',cine:true});
let D=blank(),step=0,A=null,tm=0,ct=0,io=null,gi=0,LK='',D2=null,CUR=null,LC='',PR=0,li=0,CL=[],U=null,RECOV=0,GO='',AMF=null,AT='ov',MUS=[],TS={},PROF=null;
const load=()=>{try{return JSON.parse(localStorage.getItem('amoria.v1')||'[]')}catch{return[]}};

function toast(t){const e=document.createElement('div');e.className='toast';e.setAttribute('role','status');e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2600)}

/* criptografia (carta secreta): AES-GCM + PBKDF2 no próprio aparelho */
const te=new TextEncoder(),b64=a=>btoa(String.fromCharCode(...a)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''),ub=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
async function key(p,s){const k=await crypto.subtle.importKey('raw',te.encode(p),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:s,iterations:150000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function enc(o,p){const s=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),c=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await key(p,s),te.encode(JSON.stringify(o))));return b64([...s,...iv,...c])}
async function dec(t,p){const u=ub(t);return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(16,28)},await key(p,u.slice(0,16)),u.slice(28))))}
async function mkLink(d){if(d.priv==='password'&&!d.pass)throw Error('nopass');const o={id:d.id,type:d.type,from:d.from,to:d.to,title:d.title,line:d.line,msg:d.msg,sign:d.sign,fin:d.fin,date:d.date,dl:d.dl,counter:d.counter,tl:d.tl,theme:d.theme,fx:d.fx,gal:d.gal,cine:d.cine,...(SB?{photos:d.photos,music:d.music&&d.music.url&&d.music.url.startsWith(CFG.url+'/storage/')?{name:d.music.name,url:d.music.url}:null}:{})},t=d.at?new Date(d.at).getTime():0,body=d.priv==='password'?'E.'+await enc(o,d.pass):'P.'+b64(te.encode(JSON.stringify(o)));return location.href.split('#')[0]+'#/amor/'+body+(t?'~'+t:'')}

/* QR Code */
function qrCanvas(text,size){if(typeof window.qrcode!=='function')throw Error('Gerador de QR Code não carregou. Verifique sua conexão e tente novamente.');const q=window.qrcode(0,'L');q.addData(text);q.make();const n=q.getModuleCount(),m=4,cs=Math.max(2,Math.floor(size/(n+2*m))),c=document.createElement('canvas');c.width=c.height=cs*(n+2*m);const x=c.getContext('2d');if(!x)throw Error('Não foi possível desenhar o QR Code neste aparelho.');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.fillStyle='#2a0a14';for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))x.fillRect((k+m)*cs,(r+m)*cs,cs,cs);return c}
function printCv(){const W=1200,c=document.createElement('canvas');c.width=W;c.height=1600;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,1600);x.textAlign='center';x.fillStyle='#9f1239';x.font='600 130px "Playfair Display",Georgia,serif';x.fillText('AMORIA',W/2,230);x.fillStyle='#34101f';x.font='italic 42px Georgia,serif';x.fillText('Transforme sentimentos em memórias.',W/2,305);x.imageSmoothingEnabled=false;x.drawImage(qrCanvas(LK,900),150,420,900,900);x.font='600 54px Georgia,serif';x.fillText('Escaneie para descobrir uma surpresa ❤️',W/2,1440);x.font='28px Georgia,serif';x.fillStyle='#85606c';x.fillText('App criado por Lucas Moraes',W/2,1530);return c}
function qrShow(p){PR=p;try{const u=(p?printCv():qrCanvas(LK,1024)).toDataURL('image/png'),a=$('#dlq');$('#qri').src=u;a.href=u;a.download=p?'amoria-qr-impressao.png':'amoria-qr.png'}catch(err){const box=$('.qr');if(box){box.setAttribute('role','alert');box.textContent=/overflow|length/i.test(err.message||'')?'O link ficou longo demais para gerar o QR Code. Reduza o texto e publique novamente.':err.message||'Não foi possível gerar o QR Code. Verifique sua conexão e tente de novo.'}}}

/* editor */
const inp=(l,k,o={})=>`<label>${l}${o.ta?`<textarea data-k="${k}" rows="${o.ta}" maxlength="1500">${esc(D[k])}</textarea>`:`<input data-k="${k}" type="text" value="${esc(D[k])}" maxlength="${o.m||80}"${o.ph?` placeholder="${esc(o.ph)}"`:''} autocomplete="off">`}</label>`;
const opts=(k,it)=>`<div class="grid">${it.map(([v,e,n,st])=>`<button class="opt${D[k]===v?' on':''}" data-a="set:${k}:${v}"${st?` style="${st}"`:''}><b>${e}</b>${n}</button>`).join('')}</div>`;
const PH={public:'Qualquer pessoa com o link pode abrir.',secret:'Link longo e não listado: só abre quem receber o endereço.',password:'O conteúdo é criptografado no seu aparelho. Guarde a senha: ela não pode ser recuperada.'};
const ST=[
['Tipo',()=>opts('type',Object.entries(TY).map(([k,t])=>[k,t.e,t.n]))],
['Pessoas',()=>inp('Seu nome (quem envia)','from')+inp('Nome de quem recebe','to')],
['História',()=>inp('Título da carta','title')+inp('Frase principal','line',{m:140})+inp('Mensagem','msg',{ta:7})+inp('Assinatura','sign')+inp('Mensagem final','fin',{m:140,ph:TY[D.type].fin||TY[D.type].q})],
['Fotos',()=>`<label class="drop">＋ Adicionar fotos (${D.photos.length}/${PLAN.fotos})<input class="vh" type="file" id="pf" accept="image/*" multiple></label><p class="mu">A primeira foto é a capa. As imagens são reduzidas e otimizadas automaticamente.</p><div class="ph">${D.photos.map((p,i)=>`<figure><img src="${p}" alt="Foto ${i+1}"><div>${i?`<button data-a="ph:c:${i}" aria-label="Definir como capa">★</button>`:'<span>Capa</span>'}<button data-a="ph:l:${i}" aria-label="Mover para trás">◀</button><button data-a="ph:r:${i}" aria-label="Mover para frente">▶</button><button data-a="ph:x:${i}" aria-label="Excluir foto">✕</button></div></figure>`).join('')}</div><h2>Estilo da galeria</h2>${opts('gal',[['carousel','🎞️','Carrossel'],['polaroid','📸','Polaroid'],['mosaic','🧩','Mosaico']])}<label><input type="checkbox" data-k="cine"${D.cine!==false?' checked':''}>Abertura em modo cinema (fotos em tela cheia)</label>`],
['Música',()=>musicLib()+`<label class="drop">${D.music?'🎵 '+esc(D.music.name)+' — trocar':'＋ Adicionar música (áudio até 15 MB)'}<input class="vh" type="file" id="mf" accept="audio/*"></label><p class="mu">Use apenas músicas que você tem direito de compartilhar. A música toca ao abrir a surpresa; se o navegador bloquear, aparece "Toque para ouvir nossa música ❤️". Nesta versão ela fica neste aparelho.</p>`],
['Datas',()=>`<label>Data especial<input type="date" data-k="date" value="${esc(D.date)}"></label><label>Tipo de data<select data-k="dl">${['Juntos há','Primeiro encontro há','Casados há','Aniversário há','Nossa história começou há'].map(x=>`<option${D.dl===x?' selected':''}>${x}</option>`).join('')}</select></label><label><input type="checkbox" data-k="counter"${D.counter?' checked':''}>Mostrar contador</label><h2>Nossa história</h2>${D.tl.map((t,i)=>`<div class="tli"><span>${fmt(t.d)} · <b>${esc(t.t)}</b></span><button data-a="tl-:${i}" aria-label="Remover ${esc(t.t)}">✕</button></div>`).join('')}<div class="row"><input type="date" id="td" aria-label="Data do momento"><input id="tt" placeholder="Ex.: Primeiro beijo" maxlength="60" aria-label="Título do momento"></div><input id="tx" placeholder="Descrição (opcional)" maxlength="160" aria-label="Descrição do momento"><div class="row"><button class="btn ghost" data-a="tl+">Adicionar momento</button></div>`],
['Tema',()=>opts('theme',Object.entries(TH).filter(([k])=>!SB||(TS[k]||{}).on!==false).map(([k,t])=>[k,t.p,t.n,`background:${t.b};color:${t.f}`]))+`<label>Animações<select data-k="fx">${Object.entries(FX).map(([k,v])=>`<option value="${k}"${D.fx===k?' selected':''}>${v[0]}</option>`).join('')}</select></label><p class="mu">Quem ativou "reduzir movimento" no aparelho não vê animações.</p>`],
['Publicar',()=>opts('priv',[['public','🌍','Público'],['secret','🔗','Link secreto'],['password','🔐','Senha']])+`<p class="mu">${PH[D.priv]}</p>`+(D.priv==='password'?inp('Senha da carta secreta','pass',{m:40}):'')+`<label>Só abrir a partir de (opcional)<input type="datetime-local" data-k="at" value="${esc(D.at)}"></label><p class="mu">Antes do horário o destinatário vê a contagem regressiva.</p><div class="row c"><button class="btn big" data-a="pub">PUBLICAR MINHA EXPERIÊNCIA ❤️</button></div>${SB&&BILL.price_cents>0?`<p class="mu c">Você pode montar e visualizar antes. O link e o QR Code são liberados depois do pagamento de ${money(BILL.price_cents)} (PIX, único).</p>`:''}`]
];
function editor(){if(!U){GO='#/criar';location.hash='#/entrar';return}app.innerHTML=`<div class="wrap"><div class="steps" aria-hidden="true">${ST.map((s,i)=>`<i class="${i<=step?'on':''}"></i>`).join('')}</div><p class="mu">Etapa ${step+1} de ${ST.length}</p><h2 tabindex="-1">${ST[step][0]}</h2>${ST[step][1]()}<div class="row">${step?'<button class="btn ghost" data-a="go:-1">Voltar</button>':''}<button class="btn ghost" data-a="prev">Pré-visualizar</button>${step<ST.length-1?'<button class="btn" data-a="go:1">Continuar</button>':''}</div></div>`}
const bmp=f=>window.createImageBitmap?createImageBitmap(f):new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=URL.createObjectURL(f)});
async function addPhotos(fs){for(const f of fs){if(D.photos.length>=PLAN.fotos){toast(`Limite de ${PLAN.fotos} fotos por experiência atingido`);break}if(f.size>12e6){toast('Foto muito grande (máx. 12 MB)');continue}try{const b=await bmp(f),r=Math.min(1,900/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=Math.round(b.width*r);c.height=Math.round(b.height*r);c.getContext('2d').drawImage(b,0,0,c.width,c.height);D.photos.push(c.toDataURL('image/jpeg',.72))}catch{toast('Não consegui ler essa imagem')}}editor()}
async function publish(){if(!D.to.trim()||!D.from.trim())return toast('Preencha o nome de quem envia e de quem recebe');if(!D.msg.trim()&&!D.line.trim())return toast('Escreva uma frase ou uma mensagem');if(D.priv==='password'&&D.pass.length<4)return toast('Defina uma senha com 4 ou mais caracteres');if(SB)return cloudPublish();const L=load(),i=L.findIndex(x=>x.id===D.id);if(!D.id)D.id=nid();let link;try{link=await mkLink(D)}catch{return toast('Não foi possível criptografar. Abra o AMORIA em HTTPS.')}const r={...D,pass:'',music:null,link,created:D.created||Date.now()};i<0?L.push(r):L[i]=r;if(!save(L))return;done(link,D)}

function pixCode(key,val,name,city,txid){const f=(i,v)=>i+String(v.length).padStart(2,'0')+v,n=t=>t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9 ]/g,'').toUpperCase();let p=f('00','01')+f('26',f('00','br.gov.bcb.pix')+f('01',key))+f('52','0000')+f('53','986')+(val>0?f('54',(val/100).toFixed(2)):'')+f('58','BR')+f('59',n(name).slice(0,25)||'AMORIA')+f('60',n(city).slice(0,15)||'SAO PAULO')+f('62',f('05',(txid||'').replace(/[^A-Za-z0-9]/g,'').slice(0,25)||'***'))+'6304',c=0xFFFF;for(const ch of p){c^=ch.charCodeAt(0)<<8;for(let i=0;i<8;i++)c=c&0x8000?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return p+c.toString(16).toUpperCase().padStart(4,'0')}
