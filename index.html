async function iaPage(){if(!SB||!U){location.hash='#/entrar';return}IAS.out='';app.innerHTML=`<div class="wrap" id="ia-ui"><h2 tabindex="-1">AMORIA AI Studio</h2><p class="mu">Ferramentas de IA para criar textos do seu presente. <b>A IA não vê as suas fotos</b>: se quiser legendas específicas, descreva as fotos no campo de contexto. Envie só o necessário (nomes ou apelidos e um resumo); não coloque dados pessoais sensíveis.</p><p class="mu" id="ia-st" aria-live="polite">Verificando disponibilidade...</p><div class="st-models" id="ia-tools">${IA_TOOLS.map(([k,n,d])=>`<button class="opt${IAS.tool===k?' on':''}" data-a="iat:${k}"><b>${esc(n)}</b><br><small>${esc(d)}</small></button>`).join('')}</div><div id="ia-form"></div><div id="ia-res"></div></div>`;iaForm();await aiStatus();iaStatusLine()}

s por usuário por dia<input id="ai-di" type="number" min="1" max="100" value="${s.daily_image_limit}"></label><h4>Custos (para a estimativa; consulte a tabela de preços do provedor)</h4><label>Preço por 1 milhão de tokens de entrada (R$)<input id="ai-pi" type="number" step="0.0001" min="0" value="${R(s.price_in_cents_per_mtok)}"></label><label>Preço por 1 milhão de tokens de saída (R$)<input id="ai-po" type="number" step="0.0001" min="0" value="${R(s.price_out_cents_per_mtok)}"></label><label>Preço por imagem (R$)<input id="ai-pm" type="number" step="0.0001" min="0" value="${R(s.price_image_cents)}"></label><label>Teto mensal de gasto estimado (R$, vazio = sem teto)<input id="ai-bu" type="number" step="0.01" min="0" value="${s.monthly_budget_cents?(s.monthly_budget_cents/100).toFixed(2):''}"></label><button class="btn" data-a="aisave">Salvar</button><h3>Como configurar</h3><ol><li>No Netlify (Site configuration → Environment variables), crie <code>ANTHROPIC_API_KEY</code> para textos e, se quiser fundos com IA, <code>OPENAI_API_KEY</code>.</li><li>Faça um novo deploy para as variáveis valerem.</li><li>Gerar imagens usa uma função em segundo plano: <code>${esc(st.background_url||'(URL do site indisponível)')}</code></li><li>Volte aqui, ative os recursos e use "Testar".</li></ol><h3>Uso e custo</h3><div class="row"><label>De<input id="ai-rf" type="date" value="${esc(IAR.f)}"></label><label>Até<input id="ai-rt" type="date" value="${esc(IAR.t)}"></label></div><button class="btn ghost" data-a="airep">Atualizar</button><p class="mu">Sem datas: últimos 30 dias. O custo é uma estimativa a partir dos preços acima e dos tokens informados pelo provedor.</p><div class="grid"><div class="card"><h3>${rep.calls_ok}</h3><p class="mu">Gerações concluídas</p></div><div class="card"><h3>${rep.calls_error}</h3><p class="mu">Com erro</p></div><div class="card"><h3>${rep.users}</h3><p class="mu">Usuários</p></div><div class="card"><h3>${Number(rep.input_tokens).toLocaleString('pt-BR')} / const bmp=f=>window.createImageBitmap?createImageBitmap(f):new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=URL.createObjectURL(f)});
async function addPhotos(fs){for(const f of fs){if(D.photos.length>=PLAN.fotos){toast(`Limite de ${PLAN.fotos} fotos por experiência atingido`);break}if(f.size>12e6){toast('Foto muito grande (máx. 12 MB)');continue}try{const b=await bmp(f),r=Math.min(1,900/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=Math.round(b.width*r);c.height=Math.round(b.height*r);c.getContext('2d').drawImage(b,0,0,c.width,c.height);D.photos.push(c.toDataURL('image/jpeg',.72))}catch{toast('Não consegui ler essa imagem')}}editor()}
const VIDEO_LIMIT=3,VIDEO_MAX_BYTES=25*1024*1024,VIDEO_TYPES=['video/mp4','video/webm'];
function videoType(f){if(VIDEO_TYPES.includes(f.type))return f.type;const ext=(f.name.split('.').pop()||'').toLowerCase();return ext==='mp4'?'video/mp4':ext==='webm'?'video/webm':''}
function addVideos(fs){for(const f of fs){if(D.videos.length>=VIDEO_LIMIT){toast(`Limite de ${VIDEO_LIMIT} vídeos por experiência atingido`);break}if(!videoType(f)){toast('Formato não compatível. Escolha um vídeo MP4 ou WebM.');continue}if(f.size>VIDEO_MAX_BYTES){toast('Vídeo muito grande (máx. 25 MB)');continue}D.videos.push({name:f.name,url:URL.createObjectURL(f),file:f})}editor()}
